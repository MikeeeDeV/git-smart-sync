<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#0f0f17" />
    </linearGradient>
    <linearGradient id="gitOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1502F" />
      <stop offset="100%" stop-color="#E83E8C" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3A7BD5" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Outer Orbit Sync Ring -->
  <path d="M 64 22 A 42 42 0 0 1 106 64" fill="none" stroke="url(#cyanGlow)" stroke-width="5" stroke-linecap="round" />
  <polygon points="106,64 114,54 106,58 98,54" fill="#00D2FF" transform="rotate(40 106 64)" />

  <path d="M 64 106 A 42 42 0 0 1 22 64" fill="none" stroke="url(#gitOrange)" stroke-width="5" stroke-linecap="round" />
  <polygon points="22,64 14,74 22,70 30,74" fill="#F1502F" transform="rotate(40 22 64)" />

  <!-- Branch Trunk Line -->
  <line x1="44" y1="36" x2="44" y2="92" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Branch Curved Fork -->
  <path d="M 44 64 C 44 48, 84 58, 84 42" fill="none" stroke="url(#cyanGlow)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 44 72 C 44 88, 84 78, 84 94" fill="none" stroke="url(#emerald)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Git Node Circles -->
  <!-- Top Main Node -->
  <circle cx="44" cy="36" r="7" fill="url(#gitOrange)" filter="url(#glow)" />
  <circle cx="44" cy="36" r="3.5" fill="#ffffff" />

  <!-- Center Fork Node -->
  <circle cx="44" cy="68" r="6" fill="#ffffff" />

  <!-- Bottom Main Node -->
  <circle cx="44" cy="92" r="7" fill="url(#gitOrange)" filter="url(#glow)" />
  <circle cx="44" cy="92" r="3.5" fill="#ffffff" />

  <!-- Branch Node Right Top -->
  <circle cx="84" cy="42" r="7" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle cx="84" cy="42" r="3.5" fill="#ffffff" />

  <!-- Branch Node Right Bottom -->
  <circle cx="84" cy="94" r="7" fill="url(#emerald)" filter="url(#glow)" />
  <circle cx="84" cy="94" r="3.5" fill="#ffffff" />
</svg>
